bpmns:
  tenants:
    - id: "greenbank"
      flows:
        payment-transfer: "PayerFundTransfer-{dfspid}"  # Mojaloop routing for GovStack G2P
        outbound-transfer-request: "minimal_mock_transfer_request-{dfspid}"
    - id: "bluebank"
      flows:
        payment-transfer: "minimal_mock_fund_transfer-{dfspid}"  # closedloop via the mock payment scheme (no Fineract)
    - id: "redbank"
      flows:
        payment-transfer: "minimal_mock_fund_transfer-{dfspid}"
        outbound-transfer-request: "minimal_mock_transfer_request-{dfspid}"
